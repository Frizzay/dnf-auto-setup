---
- name: Set up dnf automatic with Discord notifications
  hosts: all
  become: true

  vars_prompt:
    - name: discord_webhook_url
      prompt: "Discord webhook URL (input is hidden)"
      private: true

    - name: dnf_auto_upgrade_type
      prompt: "Which updates should be installed? (security/default)"
      default: security
      private: false

    - name: dnf_auto_reboot
      prompt: "Reboot automatically? (never/when-needed/when-changed)"
      default: never
      private: false

    - name: dnf_auto_emit_no_updates
      prompt: "Also notify when there were no updates? (y/n)"
      default: n
      private: false

    - name: dnf_auto_time
      prompt: "Time of the daily run (HH:MM)"
      default: "03:00"
      private: false

    - name: dnf_auto_random_delay
      prompt: "Random delay in minutes (0 = none)"
      default: "0"
      private: false

    - name: dnf_auto_catch_up
      prompt: "Catch up on missed runs after boot? (y/n)"
      default: n
      private: false

  vars:
    dnf_auto_emit_no_updates_enabled: "{{ (dnf_auto_emit_no_updates | lower) in ['y', 'yes'] }}"
    dnf_auto_catch_up_enabled: "{{ (dnf_auto_catch_up | lower) in ['y', 'yes'] }}"
    dnf_auto_timer: dnf5-automatic.timer
    discord_notify_script: /usr/local/bin/dnf-discord-notify
    discord_webhook_file: /etc/dnf/discord-webhook

  tasks:
    - name: Check prerequisites and input
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Fedora"
          - ansible_distribution_major_version | int >= 41
          - "'/api/webhooks/' in discord_webhook_url"
          - dnf_auto_upgrade_type in ['security', 'default']
          - dnf_auto_reboot in ['never', 'when-needed', 'when-changed']
          - (dnf_auto_emit_no_updates | lower) in ['y', 'yes', 'n', 'no']
          - "dnf_auto_time is match('^([01]?[0-9]|2[0-3]):[0-5][0-9]$')"
          - "dnf_auto_random_delay is match('^[0-9]+$')"
          - (dnf_auto_catch_up | lower) in ['y', 'yes', 'n', 'no']
        fail_msg: >-
          Invalid input or not Fedora 41+. Expected a Discord webhook URL,
          security/default, never/when-needed/when-changed, y/n,
          a time such as 03:00, a number for the delay and y/n.
        quiet: true

    - name: Check whether the dnf5 Python bindings are installed
      ansible.builtin.command: rpm -q python3-libdnf5
      register: libdnf5_check
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Install python3-libdnf5 (required by the Ansible package module)
      ansible.builtin.command: dnf install -y python3-libdnf5
      when: libdnf5_check.rc != 0

    - name: Install packages
      ansible.builtin.package:
        name:
          - dnf5-plugin-automatic
          - jq
          - curl
        state: present

    - name: Store the webhook URL (readable by root only)
      ansible.builtin.copy:
        dest: "{{ discord_webhook_file }}"
        content: "{{ discord_webhook_url }}\n"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Install the Discord notification script
      ansible.builtin.copy:
        dest: "{{ discord_notify_script }}"
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/bash
          # Managed by Ansible
          # Sends the dnf automatic report (read from stdin) to Discord
          set -euo pipefail
          WEBHOOK_URL="$(cat {{ discord_webhook_file }})"
          BODY="$(cat)"
          # Discord allows at most 2000 characters per message, so truncate
          MSG="### 🛡️ {{ 'Security updates' if dnf_auto_upgrade_type == 'security' else 'Updates' }} on $(hostname)
          -# $(date '+%Y-%m-%d %H:%M')
          \`\`\`
          ${BODY:0:1800}
          \`\`\`"
          jq -n --arg content "$MSG" '{content: $content}' \
            | curl -fsS -H "Content-Type: application/json" -d @- "$WEBHOOK_URL"

    - name: Configure dnf automatic
      ansible.builtin.copy:
        dest: /etc/dnf/automatic.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by Ansible
          [commands]
          upgrade_type = {{ dnf_auto_upgrade_type }}
          apply_updates = yes
          reboot = {{ dnf_auto_reboot }}

          [emitters]
          emit_via = command
          emit_no_updates = {{ 'yes' if dnf_auto_emit_no_updates_enabled | bool else 'no' }}

          [command]
          command_format = {{ discord_notify_script }}

    - name: Create the drop-in directory for the timer
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ dnf_auto_timer }}.d"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Set the timer's schedule and catch-up behaviour
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ dnf_auto_timer }}.d/schedule.conf"
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by Ansible
          [Timer]
          # The empty entry clears the package's default schedule
          OnCalendar=
          OnCalendar=*-*-* {{ dnf_auto_time }}
          RandomizedDelaySec={{ dnf_auto_random_delay }}min
          Persistent={{ 'true' if dnf_auto_catch_up_enabled | bool else 'false' }}
      notify: Restart the timer

    - name: Enable and start the timer
      ansible.builtin.systemd:
        name: "{{ dnf_auto_timer }}"
        enabled: true
        state: started
        daemon_reload: true

    - name: Send a test message to Discord
      ansible.builtin.command:
        cmd: "{{ discord_notify_script }}"
        stdin: "Test message from Ansible: notifications are working."
      tags: [never, test]

  handlers:
    - name: Restart the timer
      ansible.builtin.systemd:
        name: "{{ dnf_auto_timer }}"
        state: restarted
        daemon_reload: true